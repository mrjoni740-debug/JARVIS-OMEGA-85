<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS OMEGA-85</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
            color: #00f0ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 30px 20px;
            overflow: hidden;
        }

        .header {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00f0ff;
        }

        /* 3D-Style Arc Reactor Component */
        .arc-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .arc-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px dashed #00f0ff;
            border-radius: 50%;
            animation: spin 12s linear infinite;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
        }

        .arc-inner {
            position: absolute;
            width: 80%;
            height: 80%;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            opacity: 0.6;
            animation: spin-reverse 8s linear infinite;
        }

        .core {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #ffffff 10%, #00f0ff 50%, #0a192f 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px #00f0ff, inset 0 0 20px #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            color: #020c1b;
            text-shadow: 0 0 5px #ffffff;
            transition: all 0.3s ease;
        }

        .core.listening {
            animation: pulse 1.5s infinite;
            background: radial-gradient(circle, #ffffff 10%, #ff0055 60%, #0a192f 100%);
            box-shadow: 0 0 40px #ff0055;
        }

        /* Controls & Console */
        .panel {
            width: 100%;
            max-width: 450px;
            background: rgba(10, 25, 47, 0.7);
            border: 1px solid #00f0ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            text-align: center;
        }

        .status-msg {
            font-size: 16px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .btn {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 24px;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .btn:hover {
            background: #00f0ff;
            color: #020c1b;
            box-shadow: 0 0 20px #00f0ff;
        }

        /* Animations */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">JARVIS OMEGA-85</div>

    <!-- Arc Reactor System Touch Trigger -->
    <div class="arc-container" onclick="triggerVoice()">
        <div class="arc-outer"></div>
        <div class="arc-inner"></div>
        <div class="core" id="reactorCore">SYSTEM Ready</div>
    </div>

    <!-- Interface Controls -->
    <div class="panel">
        <div class="status-msg" id="statusOutput">JARVIS System Status: Online, Sir.</div>
        <button class="btn" onclick="triggerVoice()">ACTIVATE VOICE</button>
        <button class="btn" onclick="testVoiceOutput()">TEST VOICE SPEED</button>
    </div>

    <script>
        const reactorCore = document.getElementById('reactorCore');
        const statusOutput = document.getElementById('statusOutput');

        // REPLACEMENT NOTE: Put your generated Gemini API key in the placeholder below
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"; 

        // 1. Force Browser Microphone Prompt on Launch
        window.addEventListener('load', () => {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    statusOutput.innerText = "Microphone initialized successfully.";
                    stream.getTracks().forEach(track => track.stop());
                })
                .catch(err => {
                    statusOutput.innerText = "Please enable Microphone permissions in system settings.";
                });
        });

        // 2. High Quality Speech Synthesis (TTS Engine)
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stops previous voice queues
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN'; // Clear Indian Native Accent
                utterance.pitch = 1.0;
                utterance.rate = 1.0; 
                window.speechSynthesis.speak(utterance);
            } else {
                statusOutput.innerText = "Speech Synthesis Engine Error.";
            }
        }

        function testVoiceOutput() {
            speak("System checking complete. J.A.R.V.I.S. online hai. Main aapki sahayata ke liye taiyar hoon.");
        }

        // 3. Speech to Text & Gemini Pipeline
        function triggerVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusOutput.innerText = "Speech Recognition not supported on this platform.";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;

            recognition.onstart = () => {
                reactorCore.classList.add('listening');
                reactorCore.innerText = "LISTENING...";
                statusOutput.innerText = "Listening to your command...";
            };

            recognition.onerror = (e) => {
                reactorCore.classList.remove('listening');
                reactorCore.innerText = "SYSTEM Ready";
                statusOutput.innerText = "Voice Recognition Error. Try again.";
            };

            recognition.onresult = (event) => {
                reactorCore.classList.remove('listening');
                reactorCore.innerText = "PROCESSING";
                const speechToText = event.results[0][0].transcript;
                statusOutput.innerText = `You said: "${speechToText}"`;
                
                queryGeminiAI(speechToText);
            };

            recognition.start();
        }

        // 4. Secure Gemini REST Client API Core Integration
        async function queryGeminiAI(promptText) {
            if(GEMINI_API_KEY === "AQ.Ab8RN6Iz_cUAMYb-GDzTTbu3PnUeayCDo4GlOKV1wk2_iPoc9A" || !GEMINI_API_KEY) {
                reactorCore.innerText = "SETUP REQ";
                statusOutput.innerText = "Error: Please input a valid Gemini API Key inside index.html.";
                speak("Sir, please code ke andar apni Gemini API key enter karein.");
                return;
            }

            const endpoint = `https://googleapis.com{GEMINI_API_KEY}`;
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText + " (Respond politely as an AI assistant named JARVIS in clear short Hindi/Hinglish language)" }] }]
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;
                
                reactorCore.innerText = "SYSTEM Ready";
                statusOutput.innerText = aiResponse;
                speak(aiResponse);

            } catch (error) {
                reactorCore.innerText = "ERROR";
                statusOutput.innerText = "Failed to communicate with AI core engine.";
                speak("AI Core system connection error.");
            }
        }
    </script>
</body>
</html>
